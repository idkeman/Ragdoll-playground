<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#11151c">
<title>Ragdoll Playground</title>
<style>
:root{color-scheme:dark;--bg:#11151c;--panel:#1b222d;--line:#303b4b;--muted:#9aa8ba;--accent:#72d6b0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font:14px/1.4 system-ui,sans-serif;color:#eef4fa;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 0%,#202b38,#11151c 65%)}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:8px;pointer-events:none}.brand,.toolbar,.hint{background:#171e28df;border:1px solid var(--line);backdrop-filter:blur(12px);border-radius:12px;box-shadow:0 8px 28px #0005}.brand{padding:9px 13px;font-weight:800;letter-spacing:.08em;font-size:12px}.brand span{color:var(--accent)}.toolbar{display:flex;gap:5px;padding:5px;pointer-events:auto;flex-wrap:wrap}.toolbar button,.panel button{border:1px solid #3a4657;background:#252f3d;color:#eaf2fa;padding:8px 11px;border-radius:8px;font:600 12px system-ui;cursor:pointer}.toolbar button:hover,.panel button:hover{background:#354457}.toolbar button.active,.panel button.active{background:#28624f;border-color:#4dbd95;color:white}.spacer{flex:1}.hint{padding:8px 12px;color:var(--muted);font-size:11px;pointer-events:none}.panel{position:absolute;left:12px;top:68px;width:190px;padding:12px;background:#171e28eF;border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(12px);box-shadow:0 8px 28px #0005}.panel h3{margin:0 0 9px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a9bacb}.panel .tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}.panel button{padding:9px 6px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;color:var(--muted);font-size:12px}.row input{width:90px;accent-color:var(--accent)}.bottom{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.status,.help{background:#171e28d9;border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--muted);font-size:11px}.status b{color:#eaf2fa}.help{text-align:right}.mobile{display:none}
@media(max-width:720px){.top{flex-wrap:wrap}.brand{display:none}.toolbar{max-width:100%}.hint{display:none}.panel{top:auto;bottom:58px;left:8px;width:150px;padding:8px}.panel h3{font-size:10px}.panel button{font-size:11px;padding:8px 4px}.row{font-size:10px}.bottom{bottom:8px}.help{display:none}.status{font-size:10px}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="top"><div class="brand">RAGDOLL <span>PLAYGROUND</span></div><div class="toolbar">
<button id="spawn" class="active">＋ Spawn</button><button id="pause">Ⅱ Pause</button><button id="reset">↻ Reset</button><button id="slow">◷ Slow-mo</button><button id="clear">Clear</button></div><div class="spacer"></div><div class="hint">Drag limbs · Grab objects · Scroll to zoom</div></div>
<aside class="panel"><h3>Play tools</h3><div class="tools">
<button data-tool="grab" class="active">✋ Grab</button><button data-tool="push">💨 Push</button><button data-tool="pin">📌 Pin</button><button data-tool="rope">〰 Rope</button><button data-tool="blade">⚔ Blade</button><button data-tool="bomb">💥 Bomb</button><button data-tool="ball">⚽ Ball</button><button data-tool="erase">⌫ Erase</button></div>
<div class="row"><label for="gravity">Gravity</label><input id="gravity" type="range" min="0" max="1.5" step=".05" value=".55"></div>
<div class="row"><label for="power">Tool power</label><input id="power" type="range" min="2" max="30" value="14"></div>
<div class="row"><label>Ragdolls</label><b id="count">0</b></div></aside>
<div class="bottom"><div class="status"><b id="mode">GRAB TOOL</b> · <span id="message">Ready. Spawn a ragdoll to begin.</span></div><div class="help">A / D move selected object · Space pause<br>R spawn ragdoll · Delete clear</div></div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,dpr=1,cam={x:0,y:0,zoom:1},paused=false,slow=false,tool='grab',gravity=.55,power=14;
const nodes=[],sticks=[],ragdolls=[],balls=[],particles=[],ropes=[],pins=[];
let drag=null,mouse={x:0,y:0,down:false},lastTime=0,shake=0;
const $=id=>document.getElementById(id);
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.width=W+'px';canvas.style.height=H+'px'}
addEventListener('resize',resize);resize();
function world(sx,sy){return{x:(sx-W/2)/cam.zoom+cam.x,y:(sy-H/2)/cam.zoom+cam.y}}
function screen(p){return{x:(p.x-cam.x)*cam.zoom+W/2,y:(p.y-cam.y)*cam.zoom+H/2}}
function node(x,y,r=7,m=1,color='#e8b99b'){let n={x,y,px:x,py:y,r,inv:1/m,color,pinned:false,rag:null};nodes.push(n);return n}
function stick(a,b,len,stiff=1,type='bone'){let s={a,b,len:len??Math.hypot(b.x-a.x,b.y-a.y),stiff,type};sticks.push(s);return s}
function makeRagdoll(x,y){
 const base=nodes.length,parts={};
 const add=(name,dx,dy,r=7,c)=>{parts[name]=node(x+dx,y+dy,r,1,c||'#e6b49a');parts[name].rag=ragdolls.length;return parts[name]};
 let head=add('head',0,-54,13,'#efc6a8'),neck=add('neck',0,-35,6),chest=add('chest',0,-17,11,'#5b9bc4'),hip=add('hip',0,13,10,'#477da7');
 let ls=add('leftShoulder',-17,-20,7),rs=add('rightShoulder',17,-20,7),le=add('leftElbow',-29,2,6),re=add('rightElbow',29,2,6),lw=add('leftHand',-35,24,6),rw=add('rightHand',35,24,6);
 let lk=add('leftKnee',-10,42,7),rk=add('rightKnee',10,42,7),la=add('leftFoot',-12,69,7),ra=add('rightFoot',12,69,7);
 const link=(a,b,k=1)=>stick(parts[a],parts[b],null,k);
 link('head','neck');link('neck','chest');link('chest','hip');link('chest','leftShoulder');link('chest','rightShoulder');
 link('leftShoulder','leftElbow');link('leftElbow','leftHand');link('rightShoulder','rightElbow');link('rightElbow','rightHand');
 link('hip','leftKnee');link('leftKnee','leftFoot');link('hip','rightKnee');link('rightKnee','rightFoot');
 // cross-bracing stabilizes the torso without locking limb movement
 link('leftShoulder','hip',.55);link('rightShoulder','hip',.55);
 const rag={parts,base,count:nodes.length-base,color:'#5b9bc4'};ragdolls.push(rag);
 $('count').textContent=ragdolls.length;return rag;
}
function spawn(){makeRagdoll(cam.x+(Math.random()-.5)*80,cam.y-70);say('Ragdoll spawned. Grab any body part and move it.')}
function say(s){$('message').textContent=s}
function addBall(x,y,r=18,vx=0,vy=0){balls.push({x,y,px:x-vx,py:y-vy,r,life:1,color:'#e6b84d',kind:'ball'})}
function burst(x,y,color='#ffc66d',n=24){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*power*.6;particles.push({x,y,px:x-Math.cos(a)*v,py:y-Math.sin(a)*v,life:30+Math.random()*25,color,r:1+Math.random()*3})}}
function removeAt(p){let n=nodes.find(q=>Math.hypot(q.x-p.x,q.y-p.y)<q.r+12);if(n){let i=nodes.indexOf(n);nodes.splice(i,1);for(let j=sticks.length-1;j>=0;j--)if(sticks[j].a===n||sticks[j].b===n)sticks.splice(j,1);for(let r=ragdolls.length-1;r>=0;r--)if(Object.values(ragdolls[r].parts).includes(n)){let members=Object.values(ragdolls[r].parts);members.forEach(m=>{let ix=nodes.indexOf(m);if(ix>=0)nodes.splice(ix,1)});sticks.splice(0,sticks.length,...sticks.filter(s=>!members.includes(s.a)&&!members.includes(s.b)));ragdolls.splice(r,1);$('count').textContent=ragdolls.length;break}return true}return false}
function nearest(p){let best=null,bd=1e9;for(const n of nodes){let d=Math.hypot(n.x-p.x,n.y-p.y);if(d<n.r+15&&d<bd){best=n;bd=d}}for(const b of balls){let d=Math.hypot(b.x-p.x,b.y-p.y);if(d<b.r+12&&d<bd){best=b;bd=d}}return best}
function useTool(p){
 if(tool==='push'){for(const n of nodes){let dx=n.x-p.x,dy=n.y-p.y,d=Math.hypot(dx,dy);if(d<150&&d>0){let f=(1-d/150)*power*1.4;n.px-=dx/d*f;n.py-=dy/d*f}}for(const b of balls){let dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy);if(d<150&&d>0){b.px-=dx/d*power;b.py-=dy/d*power}}burst(p.x,p.y,'#78c9f1',12);say('Shockwave launched.');}
 if(tool==='pin'){let n=nearest(p);if(n&&'inv'in n){n.pinned=!n.pinned;n.inv=n.pinned?0:1;say(n.pinned?'Body part pinned.':'Pin released.')} }
 if(tool==='rope'){let n=nearest(p);if(n&&'inv'in n){if(!window.ropeStart){window.ropeStart=n;say('Choose a second body part to connect.')}else{stick(window.ropeStart,n,null,.9,'rope');window.ropeStart=null;say('Rope connected.')}}}
 if(tool==='blade'){for(const n of nodes){if(Math.hypot(n.x-p.x,n.y-p.y)<30){n.color='#d97878';n.px+= (Math.random()-.5)*power*2;n.py-=power*.8}}burst(p.x,p.y,'#d97878',8);say('Blade strike!')}
 if(tool==='bomb'){balls.push({x:p.x,y:p.y,px:p.x,py:p.y,r:10,life:100,color:'#e45c4e',kind:'bomb'});say('Bomb placed.')}
 if(tool==='ball'){addBall(p.x,p.y,20,(Math.random()-.5)*8,-4);say('Ball spawned.')}
 if(tool==='erase'){if(removeAt(p))say('Object removed.')}
}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);mouse.down=true;mouse.x=e.clientX;mouse.y=e.clientY;let p=world(mouse.x,mouse.y);if(tool==='grab'){let obj=nearest(p);if(obj){drag={obj,ox:p.x-obj.x,oy:p.y-obj.y};say('Dragging object.')}else{drag={pan:true,x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}}}else useTool(p)});
canvas.addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;if(drag&&mouse.down){let p=world(mouse.x,mouse.y);if(drag.pan){cam.x=drag.cx-(e.clientX-drag.x)/cam.zoom;cam.y=drag.cy-(e.clientY-drag.y)/cam.zoom}else{drag.obj.x=p.x-drag.ox;drag.obj.y=p.y-drag.oy;drag.obj.px=drag.obj.x;drag.obj.py=drag.obj.y}}});
function endDrag(){mouse.down=false;drag=null}canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('wheel',e=>{e.preventDefault();let old=cam.zoom;cam.zoom=Math.max(.45,Math.min(2.3,cam.zoom*(e.deltaY<0?1.1:.9)))},{passive:false});
function step(){
 const dt=slow?.28:1,g=gravity*dt*dt,ground=cam.y+H/(2*cam.zoom)-35,left=cam.x-W/(2*cam.zoom)+20,right=cam.x+W/(2*cam.zoom)-20;
 for(const n of nodes){if(n.inv===0||n.pinned)continue;let vx=(n.x-n.px)*.992,vy=(n.y-n.py)*.992;n.px=n.x;n.py=n.y;n.x+=vx;n.y+=vy+g}
 for(const b of balls){let vx=(b.x-b.px)*.995,vy=(b.y-b.py)*.995;b.px=b.x;b.py=b.y;b.x+=vx;b.y+=vy+g*.85;if(b.kind==='bomb'&&--b.life<=0){for(const n of nodes){let dx=n.x-b.x,dy=n.y-b.y,d=Math.hypot(dx,dy);if(d<180&&d>0){let f=(1-d/180)*power*2.5;n.px-=dx/d*f;n.py-=dy/d*f}}burst(b.x,b.y,'#ff8b55',48);b.dead=true;shake=8}}
 for(let k=0;k<5;k++){for(const s of sticks){let dx=s.b.x-s.a.x,dy=s.b.y-s.a.y,d=Math.hypot(dx,dy)||.001,err=(d-s.len)/d*s.stiff*.5,ox=dx*err,oy=dy*err;if(s.a.inv){s.a.x+=ox;s.a.y+=oy}if(s.b.inv){s.b.x-=ox;s.b.y-=oy}}
 for(const n of nodes){if(n.inv===0)continue;if(n.y+n.r>ground){n.y=ground-n.r;n.py=n.y+(n.y-n.py)*.22}if(n.x-n.r<left){n.x=left+n.r;n.px=n.x+(n.x-n.px)*.25}if(n.x+n.r>right){n.x=right-n.r;n.px=n.x+(n.x-n.px)*.25}}
 for(const b of balls){if(b.y+b.r>ground){b.y=ground-b.r;b.py=b.y+(b.y-b.py)*.55}if(b.x-b.r<left){b.x=left+b.r;b.px=b.x+(b.x-b.px)*.5}if(b.x+b.r>right){b.x=right-b.r;b.px=b.x+(b.x-b.px)*.5}}
 for(const b of balls)for(const n of nodes){let dx=n.x-b.x,dy=n.y-b.y,d=Math.hypot(dx,dy)||.01,min=n.r+b.r;if(d<min){let f=(min-d)/d,ox=dx*f*.5,oy=dy*f*.5;if(n.inv){n.x+=ox;n.y+=oy}b.x-=ox;b.y-=oy}}
 }
 for(const p of particles){let vx=(p.x-p.px)*.96,vy=(p.y-p.py)*.96;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+.08;p.life--}for(let i=particles.length-1;i>=0;i--)if(particles[i].life<=0)particles.splice(i,1);
 for(let i=balls.length-1;i>=0;i--)if(balls[i].dead)balls.splice(i,1);
}
function line(a,b,color,width=4){let A=screen(a),B=screen(b);ctx.strokeStyle=color;ctx.lineWidth=width*cam.zoom;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke()}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 // subtle world grid
 let spacing=50*cam.zoom;ctx.strokeStyle='#ffffff09';ctx.lineWidth=1;ctx.beginPath();for(let x=((W/2-cam.x*cam.zoom)%spacing);x<W;x+=spacing){ctx.moveTo(x,0);ctx.lineTo(x,H)}for(let y=((H/2-cam.y*cam.zoom)%spacing);y<H;y+=spacing){ctx.moveTo(0,y);ctx.lineTo(W,y)}ctx.stroke();
 const ground=screen({x:cam.x,y:cam.y+H/(2*cam.zoom)-35});ctx.fillStyle='#252f3b';ctx.fillRect(0,ground.y,W,H-ground.y);ctx.fillStyle='#405365';ctx.fillRect(0,ground.y,W,3);
 for(const s of sticks){line(s.a,s.b,s.type==='rope'?'#d6b56d':'#c8d3df',s.type==='rope'?2.5:5);if(s.type==='bone')line(s.a,s.b,'#60798f',1.5)}
 for(const b of balls){let p=screen(b);ctx.beginPath();ctx.arc(p.x,p.y,b.r*cam.zoom,0,Math.PI*2);ctx.fillStyle=b.color;ctx.fill();ctx.strokeStyle='#fff8';ctx.lineWidth=2;ctx.stroke();if(b.kind==='bomb'){ctx.fillStyle='#fff';ctx.fillRect(p.x-2,p.y-b.r*cam.zoom-5,4,7)}}
 for(const n of nodes){let p=screen(n);ctx.beginPath();ctx.arc(p.x,p.y,n.r*cam.zoom,0,Math.PI*2);ctx.fillStyle=n.color;ctx.fill();ctx.strokeStyle=n.pinned?'#f3d16a':'#202b38';ctx.lineWidth=n.pinned?3:2;ctx.stroke();if(n.r>10){ctx.fillStyle='#553b35';ctx.beginPath();ctx.arc(p.x-4*cam.zoom,p.y-2*cam.zoom,1.5*cam.zoom,0,7);ctx.arc(p.x+4*cam.zoom,p.y-2*cam.zoom,1.5*cam.zoom,0,7);ctx.fill()}}
 for(const p of particles){let q=screen(p);ctx.globalAlpha=Math.max(0,p.life/50);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(q.x,q.y,p.r*cam.zoom,0,7);ctx.fill();ctx.globalAlpha=1}
 if(drag&&!drag.pan){let p=screen(drag.obj);ctx.beginPath();ctx.arc(p.x,p.y,drag.obj.r*cam.zoom+7,0,7);ctx.strokeStyle='#72d6b0';ctx.lineWidth=2;ctx.stroke()}
 if(shake>0){shake*=.85}
}
function loop(t){let dt=Math.min((t-lastTime)/16.67||1,2);lastTime=t;if(!paused)for(let i=0;i<Math.ceil(dt);i++)step();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('mode').textContent=t.toUpperCase()+' TOOL'}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
$('spawn').onclick=spawn;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ Resume':'Ⅱ Pause';say(paused?'Simulation paused.':'Simulation resumed.')};
$('reset').onclick=()=>{nodes.length=0;sticks.length=0;ragdolls.length=0;balls.length=0;particles.length=0;cam.x=0;cam.y=0;$('count').textContent='0';spawn()};
$('clear').onclick=()=>{nodes.length=0;sticks.length=0;ragdolls.length=0;balls.length=0;particles.length=0;$('count').textContent='0';say('Playground cleared.')};
$('slow').onclick=()=>{slow=!slow;$('slow').classList.toggle('active',slow);say(slow?'Slow motion enabled.':'Normal speed restored.')};
$('gravity').oninput=e=>gravity=+e.target.value;$('power').oninput=e=>power=+e.target.value;
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('pause').click()}if(e.code==='KeyR')spawn();if(e.code==='Delete'||e.code==='Backspace')$('clear').click();if(e.code==='KeyA'&&drag&&!drag.pan)drag.obj.px+=power;if(e.code==='KeyD'&&drag&&!drag.pan)drag.obj.px-=power});
spawn();setTool('grab');
})();
</script>
</body></html>
